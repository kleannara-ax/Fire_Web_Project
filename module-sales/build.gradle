// module-sales: 영업/매출 관리 신규 업무 모듈
// - URL Prefix: /sales-api/**
// - DB Table Prefix: MOD_SALES_
// - 패키지: com.company.module.sales
//
// [의존 구조]
//   compileOnly project(':core')  → 컴파일 시에만 참조 (ApiResponse, BusinessException 등)
//   런타임에는 core 앱이 모든 클래스를 포함하므로 runtimeOnly 불필요

dependencies {
    // core 공통 클래스 참조 (컴파일 전용: 순환 의존 방지)
    compileOnly project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
}

// spring-boot 플러그인 미적용 서브모듈: plain jar만 생성
jar {
    enabled = true
}
