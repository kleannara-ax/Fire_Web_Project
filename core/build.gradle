plugins {
    id 'org.springframework.boot'
}

// core 모듈: Spring Boot Application 진입점
// - Spring Security 설정
// - 공통 예외 처리
// - 공통 응답 포맷
// - 각 모듈을 runtimeClasspath에서 참조
apply plugin: 'org.springframework.boot'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MariaDB 드라이버
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // JWT (JJWT 0.12.x - Spring Boot 3.x 호환)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Logging
    implementation 'org.springframework.boot:spring-boot-starter-logging'

    // 업무 모듈 의존성 (모든 모듈을 core에서 참조)
    implementation project(':module-user')
    implementation project(':module-fire')
    implementation project(':module-sales')
}

// core 모듈이 bootJar를 생성 (실행 가능 JAR)
bootJar {
    enabled = true
    archiveBaseName = 'fireweb'
}

jar {
    enabled = false
}
