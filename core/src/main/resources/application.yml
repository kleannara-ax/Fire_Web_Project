spring:
  application:
    name: fireweb

  # MariaDB 데이터소스
  datasource:
    url: jdbc:mariadb://localhost:3306/fireweb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: fireweb
    password: fireweb1234
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: FireWebHikariPool
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정
  jpa:
    hibernate:
      # DDL 자동 생성 비활성화 (수동 DDL 스크립트 사용)
      ddl-auto: none
      # @Table(name="MOD_SALES_ORDER") 등 대문자 테이블명 그대로 사용
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        use_sql_comments: false
        # 배치 처리 최적화
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# 서버 설정
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT 설정
security:
  jwt:
    # 운영 환경에서는 환경변수 JWT_SECRET으로 재정의 필요
    secret: ${JWT_SECRET:fireweb-default-secret-key-please-change-in-production-256bit}
    expiration-ms: 3600000  # 1시간

# 로그 설정
logging:
  level:
    root: INFO
    com.company: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/fireweb.log
    max-size: 10MB
    max-history: 14

# 파일 업로드 경로 (운영 환경에서 환경변수로 재정의)
fireweb:
  upload:
    base-path: ${UPLOAD_BASE_PATH:./uploads}
    extinguishers: ${UPLOAD_BASE_PATH:./uploads}/extinguishers
    hydrants: ${UPLOAD_BASE_PATH:./uploads}/hydrants
    inspections: ${UPLOAD_BASE_PATH:./uploads}/inspections
