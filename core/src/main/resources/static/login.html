<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireWeb - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #FFA94D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-logo {
            max-width: 260px;
            max-height: 120px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px auto;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px 40px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .fire-icon {
            font-size: 64px;
            margin-bottom: 15px;
            display: inline-block;
            animation: flicker 2s ease-in-out infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.8; }
        }

        .login-header h1 {
            color: #FF6B6B;
            font-weight: 700;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 15px;
            margin: 0;
        }

        .form-label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #FF6B6B;
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 107, 0.15);
        }

        .input-group-text {
            background: transparent;
            border: 2px solid #e0e0e0;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: #999;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .input-group:focus-within .input-group-text {
            border-color: #FF6B6B;
            color: #FF6B6B;
        }

        .btn-login {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            width: 100%;
            cursor: pointer;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            background: linear-gradient(135deg, #FF5252 0%, #FF7043 100%);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert-danger {
            border-radius: 10px;
            border: none;
            background: #FFE5E5;
            color: #D32F2F;
            padding: 12px 16px;
            margin-bottom: 20px;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%       { transform: translateX(-10px); }
            75%       { transform: translateX(10px); }
        }

        .alert-danger strong {
            color: #C62828;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="/images/logo.png" alt="로고" class="login-logo" />
            </div>

            <div id="errorAlert" class="alert alert-danger alert-dismissible fade show" role="alert" style="display:none;">
                <strong><i class="bi bi-exclamation-triangle-fill me-2"></i>로그인 실패</strong><br />
                <span id="errorMessage"></span>
                <button type="button" class="btn-close" onclick="hideError()"></button>
            </div>

            <form id="loginForm" onsubmit="doLogin(event)">
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-person-fill me-2"></i>사용자명
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="아이디를 입력하세요" required autofocus />
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        <i class="bi bi-lock-fill me-2"></i>비밀번호
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="비밀번호를 입력하세요" required />
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 이미 로그인돼 있으면 메인으로 이동
        if (localStorage.getItem('fireweb_token')) {
            window.location.href = '/';
        }

        function showError(msg) {
            const alert = document.getElementById('errorAlert');
            const span = document.getElementById('errorMessage');
            span.textContent = msg;
            alert.style.display = '';
            alert.classList.add('show');
        }

        function hideError() {
            const alert = document.getElementById('errorAlert');
            alert.style.display = 'none';
        }

        async function doLogin(e) {
            e.preventDefault();
            hideError();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                showError('아이디와 비밀번호를 입력하세요.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>로그인 중...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const json = await res.json();

                if (json.ok && json.data && json.data.token) {
                    localStorage.setItem('fireweb_token', json.data.token);
                    localStorage.setItem('fireweb_user', JSON.stringify({
                        username: json.data.username || username,
                        displayName: json.data.displayName || username,
                        role: json.data.role || 'USER'
                    }));
                    // ReturnUrl 처리
                    const params = new URLSearchParams(window.location.search);
                    const returnUrl = params.get('returnUrl') || '/';
                    window.location.href = returnUrl;
                } else {
                    showError(json.message || '아이디 또는 비밀번호가 올바르지 않습니다.');
                }
            } catch(err) {
                showError('서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>로그인';
            }
        }
    </script>
</body>
</html>
