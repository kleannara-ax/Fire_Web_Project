<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>층 도면 매핑 - FireWeb</title>
  <style>
    :root {
      --primary: #e74c3c;
      --primary-dark: #c0392b;
      --admin-color: #2980b9;
      --border: #dee2e6;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.12);
      --bg: #f8f9fa;
      --card-bg: #fff;
      --text: #212529;
      --muted: #6c757d;
      --ext-color: #e74c3c;
      --hyd-color: #3498db;
      --selected-color: #f39c12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── 헤더 ── */
    .fl-header {
      background: var(--primary);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .fl-header h1 { font-size: 1.1rem; font-weight: 700; flex: 1; }
    .fl-header .btn-back {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .fl-header .btn-back:hover { background: rgba(255,255,255,0.35); }

    /* ── 메인 레이아웃 ── */
    .fl-main {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── 좌측 패널 ── */
    .fl-sidebar {
      width: 280px;
      min-width: 240px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .fl-sidebar-header {
      padding: 12px 14px;
      background: #f1f3f5;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fl-sidebar-header .icon { font-size: 1.1rem; }

    /* 이동 대상 선택 */
    .fl-jump-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .fl-jump-section label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    .fl-jump-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      background: #fff;
      cursor: pointer;
    }
    .fl-jump-select:focus { outline: none; border-color: var(--primary); }

    /* 관리 버튼 그룹 */
    .fl-admin-btns {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .fl-admin-btns .btn-row { display: flex; gap: 6px; }
    .btn-admin {
      flex: 1;
      padding: 7px 8px;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-admin:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-save-coord   { background: #27ae60; color: #fff; }
    .btn-clear-coord  { background: #e67e22; color: #fff; }
    .btn-delete-ext   { background: var(--primary); color: #fff; }
    .btn-delete-hyd   { background: #9b59b6; color: #fff; }
    .btn-inspect      { background: var(--admin-color); color: #fff; }
    .btn-zoom-reset   { background: #95a5a6; color: #fff; }
    .btn-admin:hover:not(:disabled) { filter: brightness(0.9); }

    /* 소화기 목록 */
    .fl-list-section {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }
    .fl-list-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fl-list-title .badge {
      background: var(--ext-color);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .fl-list-title .badge-hyd {
      background: var(--hyd-color);
    }
    .fl-item {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      background: #fff;
      transition: all 0.15s;
      font-size: 0.82rem;
    }
    .fl-item:hover { border-color: var(--ext-color); background: #fff5f5; }
    .fl-item.selected { border-color: var(--selected-color); background: #fffbef; box-shadow: 0 0 0 2px rgba(243,156,18,0.3); }
    .fl-item.hyd-item:hover { border-color: var(--hyd-color); background: #f0f8ff; }
    .fl-item.hyd-item.selected { border-color: var(--hyd-color); background: #e8f4fd; box-shadow: 0 0 0 2px rgba(52,152,219,0.3); }
    .fl-item .item-serial { font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .fl-item.hyd-item .item-serial { color: var(--hyd-color); }
    .fl-item .item-type { color: var(--muted); font-size: 0.78rem; }
    .fl-item .item-coord { font-size: 0.74rem; color: #aaa; margin-top: 2px; }
    .fl-item .item-coord.has-coord { color: #27ae60; font-weight: 600; }

    /* ── 우측 도면 패널 ── */
    .fl-map-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #e9ecef;
    }
    .fl-map-toolbar {
      padding: 8px 14px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .fl-map-toolbar .location-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      flex: 1;
    }
    .fl-map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #dfe3e8;
    }
    .fl-map-wrapper.grabbing { cursor: grabbing; }
    #mapCanvas {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 마커 레이어 (canvas 위에 올라가는 DOM 마커) */
    #markerLayer {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      transform-origin: 0 0;
    }
    .map-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: all;
      cursor: pointer;
    }
    .map-marker .marker-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #fff;
      font-weight: 700;
    }
    .map-marker .marker-dot.ext { background: var(--ext-color); }
    .map-marker .marker-dot.hyd { background: var(--hyd-color); }
    .map-marker.selected .marker-dot { border-color: var(--selected-color); box-shadow: 0 0 0 3px rgba(243,156,18,0.5); width: 26px; height: 26px; }
    .map-marker .marker-label {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      white-space: nowrap;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 1px 5px;
      border-radius: 3px;
      pointer-events: none;
    }

    /* 선택된 아이템 정보 카드 */
    .fl-info-card {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 230px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 12px 14px;
      font-size: 0.82rem;
      display: none;
      z-index: 100;
    }
    .fl-info-card.visible { display: block; }
    .fl-info-card .ic-title {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .fl-info-card.hyd-card .ic-title { color: var(--hyd-color); }
    .fl-info-card .ic-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .fl-info-card .ic-label { color: var(--muted); }
    .fl-info-card .ic-val { font-weight: 600; text-align: right; }
    .fl-info-card .ic-close {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }
    .fl-info-card .ic-close:hover { color: var(--text); }

    /* 좌표 클릭 힌트 */
    .fl-click-hint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(243,156,18,0.92);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      display: none;
      z-index: 200;
      pointer-events: none;
      white-space: nowrap;
    }
    .fl-click-hint.visible { display: block; }

    /* 도면 없음 */
    .fl-no-plan {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .fl-no-plan .no-plan-icon { font-size: 3rem; opacity: 0.4; }

    /* 로딩 오버레이 */
    .fl-loading {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--muted);
      z-index: 300;
    }
    .fl-loading .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 토스트 */
    .fl-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #333;
      color: #fff;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 0.88rem;
      z-index: 9999;
      transition: transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .fl-toast.show { transform: translateX(-50%) translateY(0); }
    .fl-toast.success { background: #27ae60; }
    .fl-toast.error { background: var(--primary); }

    /* 확인 모달 */
    .fl-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .fl-modal-overlay.open { display: flex; }
    .fl-modal {
      background: #fff;
      border-radius: 10px;
      padding: 24px 28px;
      min-width: 320px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .fl-modal h3 { font-size: 1rem; margin-bottom: 12px; font-weight: 700; }
    .fl-modal p { font-size: 0.88rem; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .fl-modal .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
    .fl-modal .btn-cancel { background: #f1f3f5; color: var(--text); border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; }
    .fl-modal .btn-confirm { background: var(--primary); color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600; }
    .fl-modal .btn-confirm.blue { background: var(--admin-color); }

    /* 인증 오버레이 */
    .fl-auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fl-auth-box {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      min-width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      text-align: center;
    }
    .fl-auth-box h2 { font-size: 1.15rem; margin-bottom: 8px; color: var(--primary); }
    .fl-auth-box p { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .fl-auth-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .fl-auth-box input:focus { outline: none; border-color: var(--primary); }
    .fl-auth-box .btn-login {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .fl-auth-box .btn-login:hover { background: var(--primary-dark); }
    .fl-auth-box .auth-err { color: var(--primary); font-size: 0.82rem; margin-top: 8px; display: none; }

    /* 반응형 */
    @media (max-width: 700px) {
      .fl-sidebar { width: 220px; min-width: 180px; }
      .fl-info-card { width: 180px; font-size: 0.76rem; }
    }
    @media (max-width: 500px) {
      .fl-main { flex-direction: column; }
      .fl-sidebar { width: 100%; max-height: 200px; flex-direction: row; overflow-x: auto; flex-wrap: wrap; }
      .fl-sidebar { min-width: unset; }
    }

    /* 검색/필터 */
    .fl-search {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }
    .fl-search input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.82rem;
    }
    .fl-search input:focus { outline: none; border-color: var(--primary); }

    /* 탭 */
    .fl-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #f8f9fa;
    }
    .fl-tab {
      flex: 1;
      padding: 8px 6px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .fl-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .fl-tab.hyd-tab.active { color: var(--hyd-color); border-bottom-color: var(--hyd-color); }

    /* 좌표 상태 뱃지 */
    .coord-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 8px;
      margin-left: 4px;
    }
    .coord-badge.ok { background: #d4edda; color: #155724; }
    .coord-badge.none { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<!-- 인증 오버레이 -->
<div class="fl-auth-overlay" id="authOverlay">
  <div class="fl-auth-box">
    <h2>🔐 FireWeb 로그인</h2>
    <p>도면 관리 기능을 사용하려면 로그인이 필요합니다.</p>
    <input type="text" id="authUsername" placeholder="아이디" autocomplete="username" />
    <input type="password" id="authPassword" placeholder="비밀번호" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="btn-login" onclick="doLogin()">로그인</button>
    <div class="auth-err" id="authErr">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 헤더 -->
<header class="fl-header">
  <button class="btn-back" onclick="location.href='/'">← 메인</button>
  <h1>🗺️ 층 도면 매핑</h1>
</header>

<!-- 메인 레이아웃 -->
<div class="fl-main">

  <!-- 좌측 패널 -->
  <div class="fl-sidebar">
    <div class="fl-sidebar-header">
      <span class="icon">🏢</span>
      <span>위치 선택</span>
    </div>

    <!-- 이동 대상 선택 -->
    <div class="fl-jump-section">
      <label>현재 도면</label>
      <select class="fl-jump-select" id="jumpSelect" onchange="onJumpSelect(this.value)">
        <option value="">-- 건물/층 선택 --</option>
      </select>
    </div>

    <!-- 관리 버튼 (관리자만 표시) -->
    <div class="fl-admin-btns" id="adminBtns" style="display:none">
      <div class="btn-row">
        <button class="btn-admin btn-save-coord" id="btnSaveCoord" onclick="saveCoord()" disabled>📌 좌표 저장</button>
        <button class="btn-admin btn-clear-coord" id="btnClearCoord" onclick="clearCoord()" disabled>✕ 좌표 삭제</button>
      </div>
      <div class="btn-row">
        <button class="btn-admin btn-inspect" id="btnInspect" onclick="openInspectModal()" disabled>✅ 점검</button>
        <button class="btn-admin btn-zoom-reset" onclick="resetZoom()">↺ 초기화</button>
      </div>
      <div class="btn-row">
        <button class="btn-admin btn-delete-ext" id="btnDeleteExt" onclick="confirmDeleteExt()" disabled>🗑 소화기 삭제</button>
        <button class="btn-admin btn-delete-hyd" id="btnDeleteHyd" onclick="confirmDeleteHyd()" disabled>🗑 소화전 삭제</button>
      </div>
    </div>

    <!-- 비관리자 확대/초기화 -->
    <div id="userBtns" style="padding:10px 14px; border-bottom:1px solid var(--border);">
      <button class="btn-admin btn-zoom-reset" style="width:100%;" onclick="resetZoom()">↺ 보기 초기화</button>
    </div>

    <!-- 탭 -->
    <div class="fl-tabs">
      <div class="fl-tab active" id="tabExt" onclick="switchTab('ext')">🧯 소화기</div>
      <div class="fl-tab hyd-tab" id="tabHyd" onclick="switchTab('hyd')">🚰 소화전</div>
    </div>

    <!-- 검색 -->
    <div class="fl-search">
      <input type="text" id="searchInput" placeholder="일련번호 검색..." oninput="filterList()" />
    </div>

    <!-- 목록 -->
    <div class="fl-list-section" id="listSection">
      <div class="fl-list-title">
        <span id="listTitleText">소화기 목록</span>
        <span class="badge" id="listBadge">0</span>
      </div>
      <div id="listItems">
        <div style="text-align:center; color:var(--muted); padding:20px; font-size:0.85rem;">도면을 선택하세요</div>
      </div>
    </div>
  </div>

  <!-- 우측 도면 패널 -->
  <div class="fl-map-panel">
    <div class="fl-map-toolbar">
      <span class="location-label" id="locationLabel">건물명 / 층명</span>
    </div>
    <div class="fl-map-wrapper" id="mapWrapper">
      <!-- 로딩 -->
      <div class="fl-loading" id="mapLoading" style="display:none">
        <div class="spinner"></div>
        <span>도면 불러오는 중...</span>
      </div>
      <!-- 초기 안내 -->
      <div class="fl-no-plan" id="noPlan">
        <div class="no-plan-icon">🗺️</div>
        <div>좌측에서 건물/층을 선택하세요</div>
      </div>
      <!-- 도면 캔버스 -->
      <canvas id="mapCanvas" style="display:none;"></canvas>
      <!-- 마커 레이어 -->
      <div id="markerLayer" style="display:none;"></div>

      <!-- 클릭 힌트 -->
      <div class="fl-click-hint" id="clickHint">📍 도면을 클릭하여 위치를 선택하세요</div>

      <!-- 선택 정보 카드 (소화기) -->
      <div class="fl-info-card" id="extInfoCard">
        <div class="ic-title">
          <span id="extInfoTitle">소화기 정보</span>
          <button class="ic-close" onclick="closeInfoCard('ext')">✕</button>
        </div>
        <div class="ic-row"><span class="ic-label">일련번호</span><span class="ic-val" id="extInfoSerial">-</span></div>
        <div class="ic-row"><span class="ic-label">종류</span><span class="ic-val" id="extInfoType">-</span></div>
        <div class="ic-row"><span class="ic-label">수량</span><span class="ic-val" id="extInfoQty">-</span></div>
        <div class="ic-row"><span class="ic-label">설치일</span><span class="ic-val" id="extInfoDate">-</span></div>
        <div class="ic-row"><span class="ic-label">최근점검</span><span class="ic-val" id="extInfoLastInspect">-</span></div>
        <div class="ic-row"><span class="ic-label">좌표</span><span class="ic-val" id="extInfoCoord">-</span></div>
      </div>

      <!-- 선택 정보 카드 (소화전) -->
      <div class="fl-info-card hyd-card" id="hydInfoCard">
        <div class="ic-title">
          <span id="hydInfoTitle">소화전 정보</span>
          <button class="ic-close" onclick="closeInfoCard('hyd')">✕</button>
        </div>
        <div class="ic-row"><span class="ic-label">일련번호</span><span class="ic-val" id="hydInfoSerial">-</span></div>
        <div class="ic-row"><span class="ic-label">타입</span><span class="ic-val" id="hydInfoType">-</span></div>
        <div class="ic-row"><span class="ic-label">작동방식</span><span class="ic-val" id="hydInfoOp">-</span></div>
        <div class="ic-row"><span class="ic-label">최근점검</span><span class="ic-val" id="hydInfoLastInspect">-</span></div>
        <div class="ic-row"><span class="ic-label">좌표</span><span class="ic-val" id="hydInfoCoord">-</span></div>
      </div>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="fl-toast" id="toast"></div>

<script>
(function() {
  'use strict';

  /* ─────────────────────────────────────────
     상태 변수
  ───────────────────────────────────────── */
  let token = null;
  let isAdmin = false;

  let currentBuildingId = null;
  let currentFloorId = null;
  let currentBuildingName = '';
  let currentFloorName = '';
  let planImagePath = null;

  let extItems = [];
  let hydItems = [];
  let selectedItem = null;   // { type:'ext'|'hyd', data: {...} }
  let pendingCoord = null;   // { x, y } 도면에서 클릭한 좌표 (백분율)
  let deleteTarget = null;   // 삭제 대상

  let activeTab = 'ext';     // 'ext' | 'hyd'
  let searchQuery = '';

  /* ─────────────────────────────────────────
     지도 상태 (pan/zoom)
  ───────────────────────────────────────── */
  const MAP = {
    scale: 1, offsetX: 0, offsetY: 0,
    dragging: false, lastX: 0, lastY: 0,
    pinching: false, lastDist: 0,
    imgWidth: 0, imgHeight: 0
  };
  let mapImage = null;
  let canvas, ctx, markerLayer, mapWrapper;

  /* ─────────────────────────────────────────
     초기화
  ───────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function() {
    canvas     = document.getElementById('mapCanvas');
    ctx        = canvas.getContext('2d');
    markerLayer = document.getElementById('markerLayer');
    mapWrapper  = document.getElementById('mapWrapper');

    // 점검 불량 라디오 이벤트
    document.querySelectorAll('input[name="faultyRadio"]').forEach(r => {
      r.addEventListener('change', () => {
        document.getElementById('faultReasonWrap').style.display =
          r.value === 'true' && r.checked ? 'block' : 'none';
      });
    });

    // 지도 이벤트 등록
    initMapEvents();

    // 토큰 확인 후 진행
    token = localStorage.getItem('jwtToken');
    if (!token) {
      showAuthOverlay();
    } else {
      onAuthenticated();
    }
  });

  /* ─────────────────────────────────────────
     인증
  ───────────────────────────────────────── */
  function showAuthOverlay() {
    document.getElementById('authOverlay').style.display = 'flex';
  }
  function hideAuthOverlay() {
    document.getElementById('authOverlay').style.display = 'none';
  }

  window.doLogin = async function() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authErr');
    errEl.style.display = 'none';

    if (!username || !password) { errEl.style.display = 'block'; errEl.textContent = '아이디/비밀번호를 입력하세요.'; return; }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok && data.data && data.data.token) {
        token = data.data.token;
        localStorage.setItem('jwtToken', token);
        hideAuthOverlay();
        onAuthenticated();
      } else {
        errEl.style.display = 'block';
        errEl.textContent = data.message || '로그인 실패';
      }
    } catch(e) {
      errEl.style.display = 'block';
      errEl.textContent = '서버 연결 오류';
    }
  };

  function onAuthenticated() {
    // 토큰에서 role 파싱
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      const roles = payload.roles || payload.role || [];
      isAdmin = Array.isArray(roles)
        ? roles.some(r => r === 'ROLE_ADMIN' || r === 'ADMIN')
        : (roles === 'ROLE_ADMIN' || roles === 'ADMIN');
    } catch(e) { isAdmin = false; }

    if (isAdmin) {
      document.getElementById('adminBtns').style.display = 'flex';
      document.getElementById('userBtns').style.display = 'none';
    }

    loadJumpTargets();
  }

  /* ─────────────────────────────────────────
     이동 대상 로드
  ───────────────────────────────────────── */
  async function loadJumpTargets() {
    try {
      const res = await authFetch('/fire-api/floor/data');
      if (!res.ok) { if (res.status === 401) { showAuthOverlay(); return; } throw new Error(); }
      const data = await res.json();
      if (!data.data) return;

      const targets = data.data.jumpTargets || [];
      const sel = document.getElementById('jumpSelect');
      sel.innerHTML = '<option value="">-- 건물/층 선택 --</option>';
      targets.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.buildingId + '|' + t.floorId;
        opt.textContent = t.label || (t.buildingName + ' ' + t.floorName);
        sel.appendChild(opt);
      });

      // URL 파라미터로 초기 선택
      const params = new URLSearchParams(location.search);
      const bid = params.get('buildingId');
      const fid = params.get('floorId');
      if (bid && fid) {
        sel.value = bid + '|' + fid;
        loadFloorData(parseInt(bid), parseInt(fid));
      } else if (targets.length > 0) {
        const first = targets[0];
        sel.value = first.buildingId + '|' + first.floorId;
        loadFloorData(first.buildingId, first.floorId);
      }
    } catch(e) {
      showToast('데이터 로드 실패', 'error');
    }
  }

  window.onJumpSelect = function(val) {
    if (!val) return;
    const [bid, fid] = val.split('|');
    loadFloorData(parseInt(bid), parseInt(fid));
  };

  /* ─────────────────────────────────────────
     도면 데이터 로드
  ───────────────────────────────────────── */
  async function loadFloorData(buildingId, floorId) {
    showMapLoading(true);
    clearSelection();

    try {
      const res = await authFetch(`/fire-api/floor/data?buildingId=${buildingId}&floorId=${floorId}`);
      if (!res.ok) { if (res.status === 401) { showAuthOverlay(); return; } throw new Error(); }
      const data = await res.json();
      if (!data.data) throw new Error();

      const d = data.data;
      currentBuildingId   = d.buildingId;
      currentFloorId      = d.floorId;
      currentBuildingName = d.buildingName;
      currentFloorName    = d.floorName;
      planImagePath       = d.planImagePath;
      extItems = d.items    || [];
      hydItems = d.hydrants || [];

      document.getElementById('locationLabel').textContent =
        `${d.buildingName} / ${d.floorName}`;

      renderList();
      loadMapImage(d.planImagePath);
    } catch(e) {
      showMapLoading(false);
      showToast('도면 데이터 로드 실패', 'error');
    }
  }

  /* ─────────────────────────────────────────
     탭 전환
  ───────────────────────────────────────── */
  window.switchTab = function(tab) {
    activeTab = tab;
    document.getElementById('tabExt').classList.toggle('active', tab === 'ext');
    document.getElementById('tabHyd').classList.toggle('active', tab === 'hyd');
    document.getElementById('listTitleText').textContent = tab === 'ext' ? '소화기 목록' : '소화전 목록';
    document.getElementById('listBadge').className = 'badge' + (tab === 'hyd' ? ' badge-hyd' : '');
    renderList();
    clearSelection();
  };

  /* ─────────────────────────────────────────
     목록 렌더링
  ───────────────────────────────────────── */
  window.filterList = function() {
    searchQuery = document.getElementById('searchInput').value.toLowerCase();
    renderList();
  };

  function renderList() {
    const container = document.getElementById('listItems');
    const badge = document.getElementById('listBadge');
    const items = activeTab === 'ext' ? extItems : hydItems;

    const filtered = items.filter(item => {
      const serial = (activeTab === 'ext' ? item.serialNumber : item.serialNumber) || '';
      return serial.toLowerCase().includes(searchQuery);
    });

    badge.textContent = filtered.length;
    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px; font-size:0.82rem;">항목이 없습니다</div>';
      return;
    }

    container.innerHTML = '';
    filtered.forEach(item => {
      const div = document.createElement('div');
      const isSelected = selectedItem && selectedItem.data === item;
      const hasCoord = item.x != null && item.y != null;

      if (activeTab === 'ext') {
        div.className = 'fl-item' + (isSelected ? ' selected' : '');
        div.innerHTML = `
          <div class="item-serial">${escHtml(item.serialNumber)}</div>
          <div class="item-type">${escHtml(item.extinguisherType)} × ${item.quantity}개</div>
          <div class="item-coord ${hasCoord ? 'has-coord' : ''}">
            ${hasCoord ? `📍 (${parseFloat(item.x).toFixed(1)}%, ${parseFloat(item.y).toFixed(1)}%)` : '위치 미등록'}
          </div>`;
        div.onclick = () => selectItem('ext', item, div);
      } else {
        div.className = 'fl-item hyd-item' + (isSelected ? ' selected' : '');
        const opLabel = item.operationType === 'Auto' ? '자동' : '수동';
        const typeLabel = item.hydrantType === 'Indoor' ? '옥내' : '옥외';
        div.innerHTML = `
          <div class="item-serial">${escHtml(item.serialNumber)}</div>
          <div class="item-type">${typeLabel} / ${opLabel}</div>
          <div class="item-coord ${hasCoord ? 'has-coord' : ''}">
            ${hasCoord ? `📍 (${parseFloat(item.x).toFixed(1)}%, ${parseFloat(item.y).toFixed(1)}%)` : '위치 미등록'}
          </div>`;
        div.onclick = () => selectItem('hyd', item, div);
      }
      container.appendChild(div);
    });
  }

  /* ─────────────────────────────────────────
     아이템 선택
  ───────────────────────────────────────── */
  function selectItem(type, item, el) {
    // 이전 선택 해제
    document.querySelectorAll('.fl-item.selected').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');

    selectedItem = { type, data: item };
    pendingCoord = null;
    document.getElementById('clickHint').classList.remove('visible');

    // 버튼 활성화
    if (isAdmin) {
      document.getElementById('btnSaveCoord').disabled = true; // 좌표 클릭 후 활성화
      document.getElementById('btnClearCoord').disabled = !(item.x != null && item.y != null);
      document.getElementById('btnInspect').disabled = false;
      document.getElementById('btnDeleteExt').disabled = type !== 'ext';
      document.getElementById('btnDeleteHyd').disabled = type !== 'hyd';
    }

    // 좌표 이동 힌트
    if (isAdmin) {
      document.getElementById('clickHint').classList.add('visible');
    }

    // 마커 하이라이트
    renderMarkers();

    // 정보 카드
    showInfoCard(type, item);

    // 도면 상 해당 마커로 스크롤 (좌표 있는 경우)
    if (item.x != null && item.y != null && mapImage) {
      focusMarker(parseFloat(item.x), parseFloat(item.y));
    }
  }

  function clearSelection() {
    selectedItem = null;
    pendingCoord = null;
    document.querySelectorAll('.fl-item.selected').forEach(e => e.classList.remove('selected'));
    if (isAdmin) {
      document.getElementById('btnSaveCoord').disabled = true;
      document.getElementById('btnClearCoord').disabled = true;
      document.getElementById('btnInspect').disabled = true;
      document.getElementById('btnDeleteExt').disabled = true;
      document.getElementById('btnDeleteHyd').disabled = true;
    }
    document.getElementById('clickHint').classList.remove('visible');
    document.getElementById('extInfoCard').classList.remove('visible');
    document.getElementById('hydInfoCard').classList.remove('visible');
    renderMarkers();
  }

  /* ─────────────────────────────────────────
     정보 카드
  ───────────────────────────────────────── */
  function showInfoCard(type, item) {
    if (type === 'ext') {
      document.getElementById('hydInfoCard').classList.remove('visible');
      document.getElementById('extInfoTitle').textContent = '🧯 ' + item.serialNumber;
      document.getElementById('extInfoSerial').textContent = item.serialNumber;
      document.getElementById('extInfoType').textContent = item.extinguisherType;
      document.getElementById('extInfoQty').textContent = item.quantity + '개';
      document.getElementById('extInfoDate').textContent = item.installDate || '-';
      const lastInspect = item.lastInspectionDate
        ? `${item.lastInspectionDate} (${item.lastInspectorName || ''})`
        : '점검 이력 없음';
      document.getElementById('extInfoLastInspect').textContent = lastInspect;
      document.getElementById('extInfoCoord').textContent =
        item.x != null ? `(${parseFloat(item.x).toFixed(1)}%, ${parseFloat(item.y).toFixed(1)}%)` : '미등록';
      document.getElementById('extInfoCard').classList.add('visible');
    } else {
      document.getElementById('extInfoCard').classList.remove('visible');
      document.getElementById('hydInfoTitle').textContent = '🚰 ' + item.serialNumber;
      document.getElementById('hydInfoSerial').textContent = item.serialNumber;
      document.getElementById('hydInfoType').textContent = item.hydrantType === 'Indoor' ? '옥내' : '옥외';
      document.getElementById('hydInfoOp').textContent = item.operationType === 'Auto' ? '자동' : '수동';
      const lastInspect = item.lastInspectionDate
        ? `${item.lastInspectionDate} (${item.lastInspectorName || ''})`
        : '점검 이력 없음';
      document.getElementById('hydInfoLastInspect').textContent = lastInspect;
      document.getElementById('hydInfoCoord').textContent =
        item.x != null ? `(${parseFloat(item.x).toFixed(1)}%, ${parseFloat(item.y).toFixed(1)}%)` : '미등록';
      document.getElementById('hydInfoCard').classList.add('visible');
    }
  }

  window.closeInfoCard = function(type) {
    document.getElementById(type === 'ext' ? 'extInfoCard' : 'hydInfoCard').classList.remove('visible');
  };

  /* ─────────────────────────────────────────
     지도 이미지 로드
  ───────────────────────────────────────── */
  function loadMapImage(imagePath) {
    if (!imagePath) {
      showMapLoading(false);
      document.getElementById('noPlan').style.display = 'flex';
      canvas.style.display = 'none';
      markerLayer.style.display = 'none';
      return;
    }

    document.getElementById('noPlan').style.display = 'none';
    mapImage = new Image();
    mapImage.onload = function() {
      MAP.imgWidth  = mapImage.naturalWidth;
      MAP.imgHeight = mapImage.naturalHeight;
      canvas.width  = MAP.imgWidth;
      canvas.height = MAP.imgHeight;
      markerLayer.style.width  = MAP.imgWidth + 'px';
      markerLayer.style.height = MAP.imgHeight + 'px';
      canvas.style.display = 'block';
      markerLayer.style.display = 'block';
      resetZoom(false);
      drawMap();
      renderMarkers();
      showMapLoading(false);
    };
    mapImage.onerror = function() {
      showMapLoading(false);
      document.getElementById('noPlan').style.display = 'flex';
      document.getElementById('noPlan').querySelector('div:last-child').textContent = '도면 이미지를 불러올 수 없습니다';
    };
    mapImage.src = imagePath;
  }

  function drawMap() {
    if (!mapImage || !ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(mapImage, 0, 0, MAP.imgWidth, MAP.imgHeight);
  }

  /* ─────────────────────────────────────────
     Pan/Zoom
  ───────────────────────────────────────── */
  function initMapEvents() {
    const wrapper = document.getElementById('mapWrapper');

    // 마우스
    wrapper.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    wrapper.addEventListener('wheel', onWheel, { passive: false });
    // 터치
    wrapper.addEventListener('touchstart', onTouchStart, { passive: false });
    wrapper.addEventListener('touchmove', onTouchMove, { passive: false });
    wrapper.addEventListener('touchend', onTouchEnd);
  }

  function onMouseDown(e) {
    if (e.target.closest('.fl-info-card')) return;
    MAP.dragging = true;
    MAP.lastX = e.clientX;
    MAP.lastY = e.clientY;
    document.getElementById('mapWrapper').classList.add('grabbing');
  }
  function onMouseMove(e) {
    if (!MAP.dragging) return;
    const dx = e.clientX - MAP.lastX;
    const dy = e.clientY - MAP.lastY;
    MAP.offsetX += dx; MAP.offsetY += dy;
    MAP.lastX = e.clientX; MAP.lastY = e.clientY;
    applyTransform();
  }
  function onMouseUp(e) {
    if (!MAP.dragging) return;
    const dx = Math.abs(e.clientX - MAP.lastX);
    const dy = Math.abs(e.clientY - MAP.lastY);
    MAP.dragging = false;
    document.getElementById('mapWrapper').classList.remove('grabbing');
    if (dx < 5 && dy < 5) onMapClick(e);
  }
  function onWheel(e) {
    e.preventDefault();
    const rect = document.getElementById('mapWrapper').getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const delta = e.deltaY < 0 ? 1.12 : 0.89;
    zoom(delta, mouseX, mouseY);
  }

  let touchStartTime = 0;
  function onTouchStart(e) {
    if (e.touches.length === 2) {
      MAP.pinching = true;
      MAP.lastDist = getTouchDist(e.touches);
    } else if (e.touches.length === 1) {
      MAP.dragging = true;
      MAP.lastX = e.touches[0].clientX;
      MAP.lastY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }
  }
  function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length === 2 && MAP.pinching) {
      const dist = getTouchDist(e.touches);
      const delta = dist / MAP.lastDist;
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = document.getElementById('mapWrapper').getBoundingClientRect();
      zoom(delta, cx - rect.left, cy - rect.top);
      MAP.lastDist = dist;
    } else if (e.touches.length === 1 && MAP.dragging) {
      const dx = e.touches[0].clientX - MAP.lastX;
      const dy = e.touches[0].clientY - MAP.lastY;
      MAP.offsetX += dx; MAP.offsetY += dy;
      MAP.lastX = e.touches[0].clientX;
      MAP.lastY = e.touches[0].clientY;
      applyTransform();
    }
  }
  function onTouchEnd(e) {
    if (MAP.pinching) { MAP.pinching = false; return; }
    if (MAP.dragging) {
      MAP.dragging = false;
      const elapsed = Date.now() - touchStartTime;
      const dx = e.changedTouches[0].clientX - MAP.lastX;
      const dy = e.changedTouches[0].clientY - MAP.lastY;
      if (elapsed < 250 && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        onMapClick({ clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY });
      }
    }
  }
  function getTouchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function zoom(delta, pivotX, pivotY) {
    const newScale = Math.min(Math.max(MAP.scale * delta, 0.3), 8);
    const factor = newScale / MAP.scale;
    MAP.offsetX = pivotX - factor * (pivotX - MAP.offsetX);
    MAP.offsetY = pivotY - factor * (pivotY - MAP.offsetY);
    MAP.scale = newScale;
    applyTransform();
  }

  function applyTransform() {
    const t = `translate(${MAP.offsetX}px, ${MAP.offsetY}px) scale(${MAP.scale})`;
    canvas.style.transform = t;
    markerLayer.style.transform = t;
  }

  window.resetZoom = function(animate) {
    if (!mapImage) return;
    const wrapper = document.getElementById('mapWrapper');
    const ww = wrapper.clientWidth;
    const wh = wrapper.clientHeight;
    const scale = Math.min(ww / MAP.imgWidth, wh / MAP.imgHeight);
    MAP.scale = scale;
    MAP.offsetX = (ww - MAP.imgWidth  * scale) / 2;
    MAP.offsetY = (wh - MAP.imgHeight * scale) / 2;
    applyTransform();
  };

  function focusMarker(xPct, yPct) {
    if (!mapImage) return;
    const wrapper = document.getElementById('mapWrapper');
    const ww = wrapper.clientWidth;
    const wh = wrapper.clientHeight;
    const mx = (xPct / 100) * MAP.imgWidth;
    const my = (yPct / 100) * MAP.imgHeight;
    MAP.offsetX = ww/2 - mx * MAP.scale;
    MAP.offsetY = wh/2 - my * MAP.scale;
    applyTransform();
  }

  /* ─────────────────────────────────────────
     도면 클릭 → 좌표 선택
  ───────────────────────────────────────── */
  function onMapClick(e) {
    if (!selectedItem || !isAdmin || !mapImage) return;

    const wrapper = document.getElementById('mapWrapper');
    const rect = wrapper.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    // 캔버스 좌표로 변환 (transform 역계산)
    const imgX = (clickX - MAP.offsetX) / MAP.scale;
    const imgY = (clickY - MAP.offsetY) / MAP.scale;

    // 범위 체크
    if (imgX < 0 || imgY < 0 || imgX > MAP.imgWidth || imgY > MAP.imgHeight) return;

    // 백분율 좌표
    const xPct = (imgX / MAP.imgWidth)  * 100;
    const yPct = (imgY / MAP.imgHeight) * 100;
    pendingCoord = { x: xPct, y: yPct };

    document.getElementById('clickHint').classList.remove('visible');
    document.getElementById('btnSaveCoord').disabled = false;

    // 임시 마커 표시
    renderMarkers(pendingCoord);

    showToast(`위치 선택됨 (${xPct.toFixed(1)}%, ${yPct.toFixed(1)}%) - 저장 버튼을 눌러 확정`, 'success');
  }

  /* ─────────────────────────────────────────
     마커 렌더링
  ───────────────────────────────────────── */
  function renderMarkers(pending) {
    markerLayer.innerHTML = '';
    if (!mapImage) return;

    const allItems = [
      ...extItems.map(i => ({ type: 'ext', data: i })),
      ...hydItems.map(i => ({ type: 'hyd', data: i }))
    ];

    // 그룹별 마커 (같은 groupId는 대표 하나만)
    const rendered = new Set();
    allItems.forEach(({ type, data }) => {
      const hasCoord = data.x != null && data.y != null;
      if (!hasCoord) return;

      // 그룹이 있으면 대표 하나만 표시
      const groupKey = type === 'ext' && data.groupId ? 'g' + data.groupId : (type + data[type === 'ext' ? 'extinguisherId' : 'hydrantId']);
      if (rendered.has(groupKey)) return;
      rendered.add(groupKey);

      const isSelected = selectedItem && selectedItem.data === data;
      const xPct = parseFloat(data.x);
      const yPct = parseFloat(data.y);
      const px   = (xPct / 100) * MAP.imgWidth;
      const py   = (yPct / 100) * MAP.imgHeight;

      // 같은 그룹의 소화기 수 계산
      let count = 1;
      if (type === 'ext' && data.groupId) {
        count = extItems.filter(i => i.groupId === data.groupId).length;
      }

      const marker = document.createElement('div');
      marker.className = 'map-marker' + (isSelected ? ' selected' : '');
      marker.style.left = px + 'px';
      marker.style.top  = py + 'px';

      const serial = data.serialNumber || '';
      const shortSerial = serial.length > 10 ? serial.slice(-6) : serial;

      marker.innerHTML = `
        <div class="marker-label">${escHtml(shortSerial)}</div>
        <div class="marker-dot ${type}">
          ${type === 'ext' ? (count > 1 ? count : '🧯') : '🚰'}
        </div>`;

      marker.addEventListener('click', function(e) {
        e.stopPropagation();
        // 해당 탭으로 전환 후 선택
        if (activeTab !== type) switchTab(type);
        const listEl = document.querySelector(`.fl-item[data-id="${data[type === 'ext' ? 'extinguisherId' : 'hydrantId']}"]`);
        selectItem(type, data, listEl || document.createElement('div'));
        // 목록 재렌더 후 선택 표시
        renderList();
        // 해당 아이템으로 스크롤
        setTimeout(() => {
          const items = document.querySelectorAll('.fl-item');
          items.forEach(el => {
            if (el.textContent.includes(serial)) {
              el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
          });
        }, 50);
      });

      markerLayer.appendChild(marker);
    });

    // 임시 pending 마커
    if (pending && mapImage) {
      const px = (pending.x / 100) * MAP.imgWidth;
      const py = (pending.y / 100) * MAP.imgHeight;
      const marker = document.createElement('div');
      marker.className = 'map-marker selected';
      marker.style.left = px + 'px';
      marker.style.top  = py + 'px';
      marker.innerHTML = `
        <div class="marker-label">새 위치</div>
        <div class="marker-dot" style="background:#f39c12; width:26px; height:26px;">📍</div>`;
      markerLayer.appendChild(marker);
    }
  }

  /* ─────────────────────────────────────────
     좌표 저장
  ───────────────────────────────────────── */
  window.saveCoord = async function() {
    if (!selectedItem || !pendingCoord) return;
    const { type, data } = selectedItem;
    const url = type === 'ext' ? '/fire-api/floor/ext/save' : '/fire-api/floor/hyd/save';
    const body = type === 'ext'
      ? { extinguisherId: data.extinguisherId, groupId: data.groupId,
          buildingId: currentBuildingId, floorId: currentFloorId,
          x: pendingCoord.x, y: pendingCoord.y }
      : { hydrantId: data.hydrantId, x: pendingCoord.x, y: pendingCoord.y };

    try {
      const res = await authFetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) throw new Error();
      // 로컬 업데이트
      data.x = pendingCoord.x;
      data.y = pendingCoord.y;
      pendingCoord = null;
      document.getElementById('btnSaveCoord').disabled = true;
      document.getElementById('btnClearCoord').disabled = false;
      renderList();
      renderMarkers();
      showInfoCard(type, data);
      showToast('좌표가 저장되었습니다', 'success');
    } catch(e) {
      showToast('좌표 저장 실패', 'error');
    }
  };

  /* ─────────────────────────────────────────
     좌표 삭제
  ───────────────────────────────────────── */
  window.clearCoord = async function() {
    if (!selectedItem) return;
    const { type, data } = selectedItem;
    const url = type === 'ext' ? '/fire-api/floor/ext/clear' : '/fire-api/floor/hyd/clear';
    const body = type === 'ext'
      ? { extinguisherId: data.extinguisherId, buildingId: currentBuildingId, floorId: currentFloorId }
      : { hydrantId: data.hydrantId };

    try {
      const res = await authFetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) throw new Error();
      data.x = null; data.y = null;
      pendingCoord = null;
      document.getElementById('btnClearCoord').disabled = true;
      document.getElementById('btnSaveCoord').disabled = true;
      renderList();
      renderMarkers();
      showInfoCard(type, data);
      showToast('좌표가 삭제되었습니다', 'success');
    } catch(e) {
      showToast('좌표 삭제 실패', 'error');
    }
  };

  /* ─────────────────────────────────────────
     점검 모달
  ───────────────────────────────────────── */
  window.openInspectModal = function() {
    if (!selectedItem) return;
    const { type, data } = selectedItem;
    document.getElementById('inspectModalTitle').textContent =
      `🔍 점검 - ${data.serialNumber}`;
    document.getElementById('inspectorName').value = '';
    document.getElementById('faultReason').value = '';
    document.getElementById('faultReasonWrap').style.display = 'none';
    document.querySelectorAll('input[name="faultyRadio"]').forEach(r => { r.checked = r.value === 'false'; });
    openModal('inspectModal');
  };

  window.submitInspect = async function() {
    if (!selectedItem) return;
    const { type, data } = selectedItem;
    const url = type === 'ext' ? '/fire-api/floor/ext/inspect' : '/fire-api/floor/hyd/inspect';
    const isFaulty = document.querySelector('input[name="faultyRadio"]:checked')?.value === 'true';
    const faultReason = document.getElementById('faultReason').value.trim();
    const inspectorName = document.getElementById('inspectorName').value.trim();

    const body = type === 'ext'
      ? { extinguisherId: data.extinguisherId, isFaulty, faultReason, inspectorName }
      : { hydrantId: data.hydrantId, isFaulty, faultReason, inspectorName };

    try {
      const res = await authFetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) throw new Error();
      // 로컬 상태 업데이트
      const today = new Date().toISOString().slice(0,10);
      data.lastInspectionDate = today;
      data.lastInspectorName  = inspectorName || '점검자';
      data.lastIsFaulty       = isFaulty;
      data.lastFaultReason    = isFaulty ? faultReason : null;
      closeModal('inspectModal');
      showInfoCard(type, data);
      showToast('점검이 기록되었습니다', 'success');
    } catch(e) {
      showToast('점검 저장 실패', 'error');
    }
  };

  /* ─────────────────────────────────────────
     소화기 삭제
  ───────────────────────────────────────── */
  window.confirmDeleteExt = function() {
    if (!selectedItem || selectedItem.type !== 'ext') return;
    deleteTarget = { type: 'ext', data: selectedItem.data };
    document.getElementById('deleteModalTitle').textContent = '소화기 삭제';
    document.getElementById('deleteModalMsg').textContent =
      `[${selectedItem.data.serialNumber}] 소화기를 삭제하시겠습니까?\n점검 이력도 함께 삭제됩니다.`;
    openModal('deleteModal');
  };

  window.confirmDeleteHyd = function() {
    if (!selectedItem || selectedItem.type !== 'hyd') return;
    deleteTarget = { type: 'hyd', data: selectedItem.data };
    document.getElementById('deleteModalTitle').textContent = '소화전 삭제';
    document.getElementById('deleteModalMsg').textContent =
      `[${selectedItem.data.serialNumber}] 소화전을 삭제하시겠습니까?\n점검 이력도 함께 삭제됩니다.`;
    openModal('deleteModal');
  };

  window.doDelete = async function() {
    if (!deleteTarget) return;
    const { type, data } = deleteTarget;
    const url = type === 'ext' ? '/fire-api/floor/ext/delete' : '/fire-api/floor/hyd/delete';
    const body = type === 'ext'
      ? { extinguisherId: data.extinguisherId, buildingId: currentBuildingId, floorId: currentFloorId }
      : { hydrantId: data.hydrantId };

    try {
      const res = await authFetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) throw new Error();
      // 목록에서 제거
      if (type === 'ext') extItems = extItems.filter(i => i !== data);
      else                hydItems = hydItems.filter(i => i !== data);
      clearSelection();
      renderList();
      renderMarkers();
      closeModal('deleteModal');
      showToast('삭제 완료', 'success');
    } catch(e) {
      closeModal('deleteModal');
      showToast('삭제 실패', 'error');
    }
  };

  /* ─────────────────────────────────────────
     유틸
  ───────────────────────────────────────── */
  function authFetch(url, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, opts);
  }

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };

  let toastTimer = null;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'fl-toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
  }

  function showMapLoading(show) {
    document.getElementById('mapLoading').style.display = show ? 'flex' : 'none';
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
})();
</script>
</body>
</html>
